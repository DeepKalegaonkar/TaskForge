name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Integration tests start postgres:17-alpine with Testcontainers,
      # using the Docker daemon that ubuntu-latest runners provide.
      - name: Run tests
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  docker:
    name: Docker image and smoke test
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Built and loaded locally only; nothing is pushed to a registry.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: taskforge:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start stack
        run: docker compose up -d --no-build --wait --wait-timeout 120

      # Exercises the running container end to end, including a SIGKILL
      # of the application and recovery of the job it was running.
      - name: Run demo scenarios
        run: bash scripts/demo.sh

      - name: Show application logs
        if: always()
        run: docker compose logs app

      - name: Stop stack
        if: always()
        run: docker compose down -v
