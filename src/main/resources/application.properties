spring.datasource.url=jdbc:postgresql://localhost:5432/taskforge
spring.datasource.username=taskforge
spring.datasource.password=${TASKFORGE_DB_PASSWORD:TaskForgeDev_2026}

# Let in-flight HTTP requests finish before the scheduler shuts down.
server.shutdown=graceful

taskforge.scheduler.workers=2
# Running jobs get this long to finish on shutdown before being interrupted.
taskforge.scheduler.shutdown-grace-period=20s

# Delay after attempt n is initial-delay * multiplier^(n-1), capped at max-delay.
taskforge.retry.initial-delay=2s
taskforge.retry.multiplier=2.0
taskforge.retry.max-delay=5m

# Used when a submission does not set maxAttempts or timeoutSeconds.
taskforge.jobs.default-max-attempts=3
taskforge.jobs.default-timeout=30s

spring.application.name=taskforge

# --- Health checks --------------------------------------------------------
# /actuator/health/liveness  : the JVM is up (restart the container if not).
# /actuator/health/readiness : the database is reachable and the workers
#                              have started after recovery (send traffic).
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,scheduler
# Details are public because this is a demo service without authentication.
management.endpoint.health.show-details=always
management.info.java.enabled=true

# --- Logging --------------------------------------------------------------
# Plain text locally. Docker Compose sets LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs,
# which writes one JSON object per line with MDC fields (jobId, jobName,
# attempt, requestId) as top-level keys.
logging.pattern.level=%5p [%X{requestId:-}%X{jobId:-}]

# --- API documentation ----------------------------------------------------
# Swagger UI: /swagger-ui.html, OpenAPI JSON: /v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
