spring.datasource.url=jdbc:postgresql://localhost:5432/taskforge
spring.datasource.username=taskforge
spring.datasource.password=${TASKFORGE_DB_PASSWORD:TaskForgeDev_2026}

# Let in-flight HTTP requests finish before the scheduler shuts down.
server.shutdown=graceful

taskforge.scheduler.workers=2
# Running jobs get this long to finish on shutdown before being interrupted.
taskforge.scheduler.shutdown-grace-period=20s

# Delay after attempt n is initial-delay * multiplier^(n-1), capped at max-delay.
taskforge.retry.initial-delay=2s
taskforge.retry.multiplier=2.0
taskforge.retry.max-delay=5m

# Used when a submission does not set maxAttempts or timeoutSeconds.
taskforge.jobs.default-max-attempts=3
taskforge.jobs.default-timeout=30s
